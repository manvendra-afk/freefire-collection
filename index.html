<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire Collection Showcase</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f111a; color: #ffffff; padding: 15px; overflow-x: hidden; }
        
        .header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 1000px; margin: 0 auto 20px auto; padding: 12px 15px; background: #1a1d29; border-radius: 8px; }
        .header h1 { color: #ffaa00; font-size: 20px; }
        .btn-login { background: #ffaa00; color: #000; padding: 8px 14px; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 14px; white-space: nowrap; }
        .btn-login:hover { background: #e09600; }
        
        .search-container { width: 100%; max-width: 600px; margin: 30px auto; text-align: center; background: #1a1d29; padding: 25px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .search-container h2 { margin-bottom: 15px; font-size: 20px; }
        
        .search-box { display: flex; flex-direction: column; gap: 10px; }
        .search-box input { width: 100%; padding: 14px; border-radius: 6px; border: 1px solid #333; background: #0f111a; color: #fff; font-size: 16px; outline: none; }
        .search-box button { width: 100%; padding: 14px; background: #ffaa00; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #000; font-size: 16px; }
        .search-box button:hover { background: #e09600; }

        .results-section { width: 100%; max-width: 1000px; margin: 20px auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 15px; }
        .grid-item { background: #1a1d29; border-radius: 8px; overflow: hidden; height: 150px; cursor: pointer; display: flex; align-items: center; justify-content: center; border: 1px solid #333; }
        .grid-item img, .grid-item video { width: 100%; height: 100%; object-fit: cover; }

        /* Modal Popup */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 1000; padding: 10px; }
        #modal-content { max-width: 100%; max-height: 80vh; border-radius: 6px; }
        #close-modal { position: absolute; top: 15px; right: 20px; font-size: 35px; color: #fff; cursor: pointer; }

        /* Tablet & Desktop Layout Adjustments */
        @media (min-width: 600px) {
            body { padding: 20px; }
            .header h1 { font-size: 24px; }
            .search-box { flex-direction: row; }
            .search-box button { width: auto; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
            .grid-item { height: 180px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>FF Collection Hub</h1>
        <a href="login.html" class="btn-login">Login / Register</a>
    </div>

    <div class="search-container">
        <h2>Find User Collection</h2>
        <div class="search-box">
            <input type="text" id="searchUid" placeholder="Enter Numeric UID" />
            <button onclick="searchCollection()">Search</button>
        </div>
    </div>

    <div class="results-section" id="results-container"></div>

    <div id="modal" onclick="closeModal()">
        <span id="close-modal">&times;</span>
        <div id="modal-viewer" onclick="event.stopPropagation()"></div>
    </div>

    <script>
        async function searchCollection() {
            const uid = document.getElementById('searchUid').value.trim();
            const container = document.getElementById('results-container');
            
            if (!/^\d+$/.test(uid)) {
                alert("Error: UID must contain numbers only.");
                return;
            }

            container.innerHTML = "<p style='text-align:center;'>Searching database...</p>";

            try {
                const response = await fetch(`/api/collection/${uid}`);
                const data = await response.json();

                if (data.error) {
                    container.innerHTML = `<p style="text-align:center; color: #ff5555;">${data.error}</p>`;
                    return;
                }

                let html = `<h2 style="font-size: 18px; margin-bottom: 10px;">Collection for UID: ${data.uid}</h2><div class="grid">`;
                data.items.forEach(item => {
                    if (item.fileType === 'image') {
                        html += `<div class="grid-item" onclick="openModal('image', '${item.fileUrl}')"><img src="${item.fileUrl}" alt="Collection Image"></div>`;
                    } else {
                        html += `<div class="grid-item" onclick="openModal('video', '${item.fileUrl}')"><video src="${item.fileUrl}"></video></div>`;
                    }
                });
                html += `</div>`;
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = `<p style="text-align:center; color: #ff5555;">Failed to connect to server.</p>`;
            }
        }

        function openModal(type, url) {
            const modal = document.getElementById('modal');
            const viewer = document.getElementById('modal-viewer');
            
            if (type === 'image') {
                viewer.innerHTML = `<img id="modal-content" src="${url}" />`;
            } else {
                viewer.innerHTML = `<video id="modal-content" src="${url}" controls autoplay />`;
            }
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
