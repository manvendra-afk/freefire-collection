<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - FF Collection</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f111a; color: #ffffff; padding: 15px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 800px; margin: 0 auto 20px auto; padding: 12px 15px; background: #1a1d29; border-radius: 8px; flex-wrap: wrap; gap: 10px; }
        .header h1 { color: #ffaa00; font-size: 18px; }
        .btn-logout { background: #ff5555; color: #fff; padding: 8px 14px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; font-size: 13px; }
        
        .upload-card { width: 100%; max-width: 800px; margin: 0 auto; background: #1a1d29; padding: 25px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .upload-card h2 { margin-bottom: 12px; font-size: 20px; }
        .upload-card p { font-size: 14px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #aaa; font-size: 14px; }
        .form-group input[type="file"] { width: 100%; padding: 14px; background: #0f111a; border: 1px dashed #555; border-radius: 6px; color: #fff; cursor: pointer; font-size: 14px; }
        
        button.btn-upload { background: #ffaa00; color: #000; padding: 14px; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; width: 100%; }
        button.btn-upload:hover { background: #e09600; }
        #status-msg { margin-top: 15px; text-align: center; font-weight: bold; font-size: 14px; word-break: break-all; }

        @media (min-width: 600px) {
            body { padding: 20px; }
            .header h1 { font-size: 22px; }
            .upload-card { padding: 30px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>UID: <span id="displayUid">Loading...</span></h1>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>

    <div class="upload-card">
        <h2>Upload Collection Files</h2>
        <p style="color: #888; margin-bottom: 20px;">Select multiple screenshots or video files to update your collection gallery.</p>
        
        <form id="uploadForm" onsubmit="uploadMedia(event)">
            <input type="hidden" id="hiddenUid" name="uid">
            
            <div class="form-group">
                <label>Select Images & Videos</label>
                <input type="file" id="mediaFiles" name="mediaFiles" multiple accept="image/*,video/*" required>
            </div>
            
            <button type="submit" class="btn-upload">Upload to Collection</button>
        </form>
        <div id="status-msg"></div>
    </div>

    <script>
        const currentUid = localStorage.getItem('ff_user_uid');
        if (!currentUid) {
            alert("Unauthorized access. Please login first.");
            window.location.href = 'login.html';
        } else {
            document.getElementById('displayUid').innerText = currentUid;
            document.getElementById('hiddenUid').value = currentUid;
        }

        async function uploadMedia(event) {
            event.preventDefault();
            const statusMsg = document.getElementById('status-msg');
            const formData = new FormData(document.getElementById('uploadForm'));
            
            statusMsg.style.color = "#ffaa00";
            statusMsg.innerText = "Uploading files, please wait...";

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const contentType = response.headers.get("content-type");
                let result;
                if (contentType && contentType.includes("application/json")) {
                    result = await response.json();
                } else {
                    result = { error: await response.text() };
                }

                if (response.ok) {
                    statusMsg.style.color = "#55ff55";
                    statusMsg.innerText = "Success! Your collection has been updated.";
                    document.getElementById('uploadForm').reset();
                    document.getElementById('hiddenUid').value = currentUid;
                } else {
                    statusMsg.style.color = "#ff5555";
                    statusMsg.innerText = result.error || "Upload failed.";
                }
            } catch (err) {
                statusMsg.style.color = "#ff5555";
                statusMsg.innerText = "Network error: " + err.message;
            }
        }

        function logout() {
            localStorage.removeItem('ff_user_uid');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
